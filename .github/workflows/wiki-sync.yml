# Mirrors docs/ and openwiki/ into the repository's GitHub wiki.
#
# The wiki is generated by scripts/wiki/build_wiki.py: each sync replaces every
# page, so edit the source files, not the wiki. Pull requests only build the
# pages, which fails on any broken link; pushes to main publish them.

name: Wiki sync

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - openwiki/**
      - scripts/wiki/**
      - .github/workflows/wiki-sync.yml
  pull_request:
    paths:
      - docs/**
      - openwiki/**
      - scripts/wiki/**
      - .github/workflows/wiki-sync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Build wiki pages (link check)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the wiki pages
        run: python3 scripts/wiki/build_wiki.py --out "$RUNNER_TEMP/wiki"

  publish:
    name: Publish to the wiki
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the wiki repository
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # GitHub creates the wiki repository only when its first page is saved
      # in the web UI; it cannot be created by a push. Until then, warn and
      # skip, so a pending setup step does not mark main as failing.
      - name: Check for an initialized wiki
        id: wiki
        run: |
          last=""
          for _ in 1 2 3; do
            if last=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.wiki.git" 2>&1); then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          # Only a missing wiki repository means uninitialized. A DNS, TLS, or
          # GitHub outage must fail the run, not silently skip the sync.
          if grep -qiE "repository ('.*' )?not found" <<<"$last"; then
            echo "::warning::The wiki has no pages yet, so nothing was published. Open the Wiki tab, choose Create the first page, save it, then re-run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not reach the wiki repository: $last"
            exit 1
          fi

      - name: Check out the wiki
        if: steps.wiki.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Build the wiki pages
        if: steps.wiki.outputs.ready == 'true'
        run: python3 scripts/wiki/build_wiki.py --out wiki --commit "$GITHUB_SHA"

      - name: Push the changes
        if: steps.wiki.outputs.ready == 'true'
        working-directory: wiki
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Sync from ${GITHUB_SHA::7}"
          git push
