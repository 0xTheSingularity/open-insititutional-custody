# Tag-triggered, signed, cross-platform release for the `oic` binary.
#
# Phase 1 integrity (per docs/designs/five-minute-self-host-quickstart.md,
# "Distribution Plan"): every artifact ships with a SHA-256 checksum AND a
# cosign keyless (OIDC) signature. This is REQUIRED in Phase 1, not deferred.
#
# NOTE: SLSA build provenance / GitHub build attestation is a Phase 3 expansion
# in the design doc ("Release provenance ... alongside the Phase 1 SHA-256
# checksums + ... cosign signature"). It is intentionally NOT added here.
# Phase 1 ships checksums + cosign signatures only.

name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  # Canonical repository identity. Used for image names and cosign identities.
  REGISTRY: ghcr.io
  IMAGE_NAME: 0xthesingularity/open-insititutional-custody

jobs:
  # ---------------------------------------------------------------------------
  # Cross-platform signed binaries -> GitHub Release.
  # ---------------------------------------------------------------------------
  release-binaries:
    name: Build & sign ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # create/append to the GitHub Release
      id-token: write # OIDC token for cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Resolve release version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build oic (release)
        run: cargo build -p oic-cli --release --target ${{ matrix.target }} --locked

      - name: Stage and package tarball
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          target="${{ matrix.target }}"
          stage="oic-${version}-${target}"
          tarball="${stage}.tar.gz"

          mkdir -p "dist/${stage}"
          cp "target/${target}/release/oic" "dist/${stage}/oic"
          cp LICENSE "dist/${stage}/LICENSE"
          cp README.md "dist/${stage}/README.md"

          tar -C dist -czf "${tarball}" "${stage}"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 checksum
        id: checksum
        shell: bash
        run: |
          set -euo pipefail
          tarball="${{ steps.package.outputs.tarball }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${tarball}" > "${tarball}.sha256"
          else
            shasum -a 256 "${tarball}" > "${tarball}.sha256"
          fi
          echo "checksum=${tarball}.sha256" >> "$GITHUB_OUTPUT"
          cat "${tarball}.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign checksum with cosign (keyless OIDC)
        shell: bash
        run: |
          set -euo pipefail
          checksum="${{ steps.checksum.outputs.checksum }}"
          # Keyless: identity is this workflow, attested by the GitHub OIDC
          # issuer. Produces a detached signature (.sig) and the ephemeral
          # signing certificate (.pem) that install.sh verifies against.
          cosign sign-blob --yes \
            --output-signature "${checksum}.sig" \
            --output-certificate "${checksum}.pem" \
            "${checksum}"

      - name: Upload binary, checksum and signature to the Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.checksum.outputs.checksum }}
            ${{ steps.checksum.outputs.checksum }}.sig
            ${{ steps.checksum.outputs.checksum }}.pem

  # ---------------------------------------------------------------------------
  # GHCR Docker image (CMD runs `oic demo`) -> ghcr.io/<repo>:<version>,:latest.
  # ---------------------------------------------------------------------------
  release-image:
    name: Build & push GHCR image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve release version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          image="${REGISTRY}/${IMAGE_NAME}"
          # Build context is the repo root so the whole workspace is available
          # to `cargo build -p oic-cli --release`. Dockerfile lives at repo root.
          docker build \
            --build-arg CARGO_PROFILE_RELEASE_DEBUG=0 \
            -t "${image}:${version}" \
            -t "${image}:latest" \
            -f Dockerfile .

      - name: Push image
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          docker push "${image}:${{ steps.version.outputs.version }}"
          docker push "${image}:latest"
