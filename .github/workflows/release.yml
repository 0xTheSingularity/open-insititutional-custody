# Tag-triggered, signed, cross-platform release for the `oic` binary.
#
# Integrity (per docs/designs/five-minute-self-host-quickstart.md, "Distribution
# Plan" and Phase 3 "Release provenance"): every tarball ships with a SHA-256
# checksum and a cosign keyless (OIDC) signature. Each tarball, the binary in
# it, and the GHCR image also get a GitHub build provenance (SLSA) attestation,
# which adds to the checksum and signature and does not replace them. Verify one
# with `gh attestation verify <file> --repo <owner>/<repo>`.
#
# Compilation runs dependency build scripts and proc macros, so it happens in
# build-binaries, which has read-only permissions and no stored git credentials.
# release-binaries holds the signing and write permissions and never compiles:
# it packages, hashes, signs, attests and uploads the built binaries.
#
# release-smoke then installs the published release the way users do, through
# the custody-check action (action.yml), and runs `oic demo --check`.

name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  # Canonical repository identity. Used for image names and cosign identities.
  REGISTRY: ghcr.io
  IMAGE_NAME: 0xthesingularity/open-insititutional-custody

jobs:
  # ---------------------------------------------------------------------------
  # Refuse a tag on a commit that is not on main, or whose oic version differs,
  # before anything is built or published.
  # ---------------------------------------------------------------------------
  verify-version:
    name: Tag matches the oic version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # main's history, for the ancestry check below
          persist-credentials: false

      - name: Compare the tag with main and Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Merge first, then tag a commit on main."
            exit 1
          fi
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "oic-cli") | .version')"
          if [ "${GITHUB_REF_NAME#v}" != "${crate}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match oic-cli ${crate}. Bump the version in cli/oic/Cargo.toml, merge it, then tag that commit."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} is on main and matches oic-cli ${crate}"

  # ---------------------------------------------------------------------------
  # Compile the binaries with read-only permissions.
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 14 runner images are unsupported from 2026-11-02
          # (actions/runner-images#13518), so both macOS targets build on macos-15.
          - os: macos-15
            target: aarch64-apple-darwin
          # Cross-compile the Intel target on the Apple-Silicon runner; the
          # toolchain step below adds the x86_64-apple-darwin target.
          - os: macos-15
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Build oic (release)
        run: cargo build -p oic-cli --release --target ${{ matrix.target }} --locked

      - name: Keep the binary for signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oic-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/oic
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Package, hash, sign, attest and upload each binary -> GitHub Release.
  # ---------------------------------------------------------------------------
  release-binaries:
    name: Sign & publish ${{ matrix.target }}
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/append to the GitHub Release
      id-token: write # OIDC token for cosign keyless signing and attestations
      attestations: write # store the build provenance attestations
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the built binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oic-${{ matrix.target }}
          path: built

      - name: Stage and package tarball
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="oic-${version}-${TARGET}"
          tarball="${stage}.tar.gz"

          mkdir -p "dist/${stage}"
          cp built/oic "dist/${stage}/oic"
          # Artifact downloads drop the execute bit.
          chmod 0755 "dist/${stage}/oic"
          cp LICENSE "dist/${stage}/LICENSE"
          cp README.md "dist/${stage}/README.md"

          tar -C dist -czf "${tarball}" "${stage}"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "binary=dist/${stage}/oic" >> "$GITHUB_OUTPUT"

      # Attest the binary as well as the tarball, so an installed `oic` can be
      # verified on its own: `gh attestation verify $(command -v oic) --repo ...`.
      - name: Attest build provenance (SLSA)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.binary }}

      - name: Generate SHA-256 checksum
        id: checksum
        shell: bash
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          # install.sh requires the file name in this line to equal the tarball's.
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          echo "checksum=${TARBALL}.sha256" >> "$GITHUB_OUTPUT"
          cat "${TARBALL}.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign checksum with cosign (keyless OIDC)
        shell: bash
        env:
          CHECKSUM: ${{ steps.checksum.outputs.checksum }}
        run: |
          set -euo pipefail
          # Keyless: identity is this workflow on this tag, attested by the
          # GitHub OIDC issuer. Produces a detached signature (.sig) and the
          # ephemeral signing certificate (.pem) that install.sh verifies.
          cosign sign-blob --yes \
            --output-signature "${CHECKSUM}.sig" \
            --output-certificate "${CHECKSUM}.pem" \
            "${CHECKSUM}"

      - name: Upload binary, checksum and signature to the Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # A tag such as v0.2.0-rc.1 publishes a prerelease, which never
          # becomes the "latest" release that install.sh installs by default.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.checksum.outputs.checksum }}
            ${{ steps.checksum.outputs.checksum }}.sig
            ${{ steps.checksum.outputs.checksum }}.pem

  # ---------------------------------------------------------------------------
  # GHCR Docker image (CMD runs `oic demo`) -> ghcr.io/<repo>:<version>, and
  # :latest for final releases once the image's provenance verifies.
  # ---------------------------------------------------------------------------
  release-image:
    name: Build & push GHCR image
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # OIDC token for the attestation signature
      attestations: write # store the build provenance attestation
      artifact-metadata: write # record the image's registry storage record
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          case "${GITHUB_REF_NAME}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Build image
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Build context is the repo root so the whole workspace is available
          # to `cargo build -p oic-cli --release`. Dockerfile lives at repo root.
          docker build \
            --build-arg CARGO_PROFILE_RELEASE_DEBUG=0 \
            -t "${REGISTRY}/${IMAGE_NAME}:${VERSION}" \
            -f Dockerfile .

      - name: Push image
        id: push
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          docker push "${image}:${VERSION}"

          # The digest the registry serves for this tag is the attestation subject.
          digest="$(docker buildx imagetools inspect "${image}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          case "${digest}" in
            sha256:*) ;;
            *) echo "::error::could not read the pushed image digest (got '${digest}')"; exit 1 ;;
          esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Image: \`${image}:${VERSION}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest image build provenance (SLSA)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify the image build provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh attestation verify "oci://${REGISTRY}/${IMAGE_NAME}:${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
            --source-ref "${GITHUB_REF}"

      # GHCR keeps a new package private by default, and a private image turns
      # the README's `docker run` into a dead end for everyone outside the
      # repository while the shell installer keeps passing. Ask the registry
      # for a pull token with no credentials: a public image grants one, a
      # private one refuses. The runner's docker login cannot leak in here
      # because this step sends no stored credentials.
      - name: Verify anonymous pulls work
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          fix="Open the repository's Packages, choose this package, then Package settings -> Change visibility -> Public, and re-run this job."
          if ! token="$(curl -fsS "https://${REGISTRY}/token?scope=repository:${IMAGE_NAME}:pull" | jq -r .token)"; then
            echo "::error::GHCR refused an anonymous pull token for ${IMAGE_NAME}, so the package is private and the documented docker run fails for users. ${fix}"
            exit 1
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://${REGISTRY}/v2/${IMAGE_NAME}/manifests/${VERSION}")"
          if [ "${code}" != "200" ]; then
            echo "::error::Anonymous pull of ${REGISTRY}/${IMAGE_NAME}:${VERSION} failed (HTTP ${code}), so the documented docker run fails for users. ${fix}"
            exit 1
          fi

      - name: Move :latest to this image
        if: steps.version.outputs.prerelease == 'false'
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          docker tag "${image}:${GITHUB_REF_NAME#v}" "${image}:latest"
          docker push "${image}:latest"
          latest="$(docker buildx imagetools inspect "${image}:latest" --format '{{json .Manifest}}' | jq -r .digest)"
          if [ "${latest}" != "${DIGEST}" ]; then
            echo "::error::${image}:latest resolves to ${latest}, not the verified ${DIGEST}"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Install the published release the way users do: the custody-check action
  # verifies the checksum, cosign signature and build provenance, then runs
  # `oic demo --check`. Runs only when every binary was published; a failed
  # build already reports itself, and its smoke test could only fail on the
  # missing asset.
  # ---------------------------------------------------------------------------
  release-smoke:
    name: Verify & check on ${{ matrix.os }}
    needs: release-binaries
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run the custody check action on the release
        uses: ./
        with:
          version: ${{ github.ref_name }}
