oic-service-api.workspace = true
oic-service-reconciler.workspace = true
oic-service-local-stack.workspace = true

# external
clap.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
