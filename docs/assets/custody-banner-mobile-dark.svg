<svg xmlns="http://www.w3.org/2000/svg" width="640" height="704" viewBox="0 0 640 704" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Open Institutional Custody · The Singularity</title>
  <desc id="desc">An open-source project by The Singularity. Your rules. Before the signature. A native transaction passes through a verified release boundary before signature output. The brief animation stops automatically; reduced-motion preferences show the complete static illustration.</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .ink { fill: #F4F3F0; }
    .muted { fill: #A6A6AD; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }

    .signal { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .signal { animation: transit 7.5s cubic-bezier(0.2, 0, 0, 1) 1; }
      .gate-accent { animation: acknowledge 7.5s cubic-bezier(0.2, 0, 0, 1) 1; }
    }
    @keyframes transit {
      0%, 8% { opacity: 0; stroke-dashoffset: 24; }
      14% { opacity: 1; stroke-dashoffset: 24; }
      46% { opacity: 1; stroke-dashoffset: -166; }
      60% { opacity: 1; stroke-dashoffset: -166; }
      88% { opacity: 1; stroke-dashoffset: -396; }
      96%, 100% { opacity: 0; stroke-dashoffset: -420; }
    }
    @keyframes acknowledge {
      0%, 35%, 78%, 100% { opacity: .05; }
      46%, 60% { opacity: .14; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal, .gate-accent { animation: none; }
    }
  </style>
