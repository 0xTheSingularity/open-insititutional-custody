<svg xmlns="http://www.w3.org/2000/svg" width="640" height="910" viewBox="0 0 640 910" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Authorize. Sign. Resolve.</title>
  <desc id="desc">First: build the transaction, independently review and approve, reserve shared exposure. Second: verify at each signer, commit the authority release, produce the native signature. Third: broadcast and observe, establish chain finality, settle the reservation. Approval, signature issuance, and settlement are separate decisions.</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .ink { fill: #0E0E12; }
    .muted { fill: #5E5E66; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  </style>
  <rect width="640" height="910" fill="#F4F3F0"/>
  <text x="40" y="51" class="muted" font-size="22" font-weight="500" letter-spacing="1">01</text><text x="106" y="53" class="ink" font-size="37" font-weight="500" letter-spacing="-.8">Authorize</text><text x="106" y="91" class="muted" font-size="23" font-weight="400" >Builder · approvers · authority</text><text x="106" y="148" class="ink" font-size="27" font-weight="400" >Build the transaction</text><circle cx="62" cy="139" r="3" fill="#0E0E12"/><text x="106" y="194" class="ink" font-size="27" font-weight="400" >Review and approve</text><circle cx="62" cy="185" r="3" fill="#0E0E12"/><text x="106" y="240" class="ink" font-size="27" font-weight="400" >Reserve shared exposure</text><circle cx="62" cy="231" r="3" fill="#0E0E12"/><path d="M62 139V231" stroke="#D5D4CF"/><path d="M40 291H600" stroke="#D5D4CF"/><text x="40" y="347" class="muted" font-size="22" font-weight="500" letter-spacing="1">02</text><text x="106" y="349" class="ink" font-size="37" font-weight="500" letter-spacing="-.8">Sign</text><text x="106" y="387" class="muted" font-size="23" font-weight="400" >Signers · authority</text><text x="106" y="444" class="ink" font-size="27" font-weight="400" >Verify at each signer</text><circle cx="62" cy="435" r="3" fill="#0E0E12"/><text x="106" y="490" class="ink" font-size="27" font-weight="400" >Commit release</text><circle cx="62" cy="481" r="3" fill="#0E0E12"/><text x="106" y="536" class="ink" font-size="27" font-weight="400" >Produce the signature</text><circle cx="62" cy="527" r="3" fill="#0E0E12"/><path d="M62 435V527" stroke="#D5D4CF"/><path d="M40 587H600" stroke="#D5D4CF"/><text x="40" y="643" class="muted" font-size="22" font-weight="500" letter-spacing="1">03</text><text x="106" y="645" class="ink" font-size="37" font-weight="500" letter-spacing="-.8">Resolve</text><text x="106" y="683" class="muted" font-size="23" font-weight="400" >Broadcaster · authority</text><text x="106" y="740" class="ink" font-size="27" font-weight="400" >Broadcast and observe</text><circle cx="62" cy="731" r="3" fill="#0E0E12"/><text x="106" y="786" class="ink" font-size="27" font-weight="400" >Establish chain finality</text><circle cx="62" cy="777" r="3" fill="#0E0E12"/><text x="106" y="832" class="ink" font-size="27" font-weight="400" >Settle the reservation</text><circle cx="62" cy="823" r="3" fill="#0E0E12"/><path d="M62 731V823" stroke="#D5D4CF"/>
</svg>
