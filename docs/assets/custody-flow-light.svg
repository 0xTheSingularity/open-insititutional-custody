<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="382" viewBox="0 0 1200 382" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Authorize. Sign. Resolve.</title>
  <desc id="desc">First: build the transaction, independently review and approve, reserve shared exposure. Second: verify at each signer, commit the authority release, produce the native signature. Third: broadcast and observe, establish chain finality, settle the reservation. Approval, signature issuance, and settlement are separate decisions.</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .ink { fill: #202024; }
    .muted { fill: #65636E; }
    .accent { fill: #6951D5; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  </style>
  <rect width="1200" height="382" fill="#F6F5F2"/>
  <text x="40" y="52" class="accent" font-size="18" font-weight="500" letter-spacing="1">01</text><path d="M306 45H384M376 39L384 45L376 51" stroke="#D6D2DD" stroke-width="1.5"/><text x="40" y="116" class="ink" font-size="39" font-weight="500" letter-spacing="-1.1">Authorize</text><text x="40" y="151" class="muted" font-size="20" font-weight="400" >Builder · approvers · authority</text><text x="62" y="212" class="ink" font-size="23" font-weight="400" >Build the transaction</text><circle cx="42" cy="205" r="2.5" fill="#6951D5"/><text x="62" y="256" class="ink" font-size="23" font-weight="400" >Review and approve</text><circle cx="42" cy="249" r="2.5" fill="#6951D5"/><text x="62" y="300" class="ink" font-size="23" font-weight="400" >Reserve shared exposure</text><circle cx="42" cy="293" r="2.5" fill="#6951D5"/><path d="M42 205V293" stroke="#D6D2DD"/><text x="436" y="52" class="accent" font-size="18" font-weight="500" letter-spacing="1">02</text><path d="M702 45H780M772 39L780 45L772 51" stroke="#D6D2DD" stroke-width="1.5"/><text x="436" y="116" class="ink" font-size="39" font-weight="500" letter-spacing="-1.1">Sign</text><text x="436" y="151" class="muted" font-size="20" font-weight="400" >Signers · authority</text><text x="458" y="212" class="ink" font-size="23" font-weight="400" >Verify at each signer</text><circle cx="438" cy="205" r="2.5" fill="#6951D5"/><text x="458" y="256" class="ink" font-size="23" font-weight="400" >Commit release</text><circle cx="438" cy="249" r="2.5" fill="#6951D5"/><text x="458" y="300" class="ink" font-size="23" font-weight="400" >Produce the signature</text><circle cx="438" cy="293" r="2.5" fill="#6951D5"/><path d="M438 205V293" stroke="#D6D2DD"/><text x="832" y="52" class="accent" font-size="18" font-weight="500" letter-spacing="1">03</text><text x="832" y="116" class="ink" font-size="39" font-weight="500" letter-spacing="-1.1">Resolve</text><text x="832" y="151" class="muted" font-size="20" font-weight="400" >Broadcaster · authority</text><text x="854" y="212" class="ink" font-size="23" font-weight="400" >Broadcast and observe</text><circle cx="834" cy="205" r="2.5" fill="#6951D5"/><text x="854" y="256" class="ink" font-size="23" font-weight="400" >Establish chain finality</text><circle cx="834" cy="249" r="2.5" fill="#6951D5"/><text x="854" y="300" class="ink" font-size="23" font-weight="400" >Settle the reservation</text><circle cx="834" cy="293" r="2.5" fill="#6951D5"/><path d="M834 205V293" stroke="#D6D2DD"/>
</svg>
