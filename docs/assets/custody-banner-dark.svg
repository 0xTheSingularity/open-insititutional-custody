<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="492" viewBox="0 0 1200 492" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Your rules. Before the signature.</title>
  <desc id="desc">Open Institutional Custody. A native transaction passes through a verified release boundary before signature output. The brief animation stops automatically; reduced-motion preferences show the complete static illustration.</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .ink { fill: #F3F1ED; }
    .muted { fill: #AAA6B2; }
    .accent { fill: #B59AFB; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }

    .signal { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .signal { animation: transit 7.5s ease-in-out 1; }
      .gate-accent { animation: acknowledge 7.5s ease-in-out 1; }
    }
    @keyframes transit {
      0%, 8% { opacity: 0; stroke-dashoffset: 24; }
      14% { opacity: 1; stroke-dashoffset: 24; }
      46% { opacity: 1; stroke-dashoffset: -166; }
      60% { opacity: 1; stroke-dashoffset: -166; }
      88% { opacity: 1; stroke-dashoffset: -396; }
      96%, 100% { opacity: 0; stroke-dashoffset: -420; }
    }
    @keyframes acknowledge {
      0%, 35%, 78%, 100% { opacity: .10; }
      46%, 60% { opacity: .28; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal, .gate-accent { animation: none; }
    }
  </style>
  <rect width="1200" height="492" fill="#151518"/>
  <g transform="translate(56 38)" stroke="#B59AFB" stroke-width="2.5" stroke-linecap="square">
    <path d="M8 0H0V24H8M24 0H32V24H24"/>
    <path d="M10 12H22"/>
  </g><text x="104" y="57" class="muted" font-size="16" font-weight="500" letter-spacing="1.4">OPEN INSTITUTIONAL CUSTODY</text><text x="51" y="178" class="ink" font-size="94" font-weight="500" letter-spacing="-4.7">Your rules.</text><text x="51" y="270" class="ink" font-size="94" font-weight="500" letter-spacing="-4.7">Before the</text><text x="51" y="362" class="ink" font-size="94" font-weight="500" letter-spacing="-4.7">signature.</text><g transform="translate(726 153) scale(1)">
    <path d="M0 114H420" stroke="#3A3642" stroke-width="2"/>
    <path class="signal" d="M0 114H420" stroke="#B59AFB" stroke-width="3" stroke-dasharray="24 460"/>
    <path d="M22 64H77L96 83V164H22Z" fill="#151518" stroke="#F3F1ED" stroke-width="2"/>
    <path d="M77 64V83H96M39 99H65M39 114H77M39 129H69" stroke="#F3F1ED" stroke-width="2"/>
    <rect class="gate-accent" x="174" y="16" width="112" height="196" fill="#B59AFB" opacity=".10"/>
    <path d="M198 16H174V212H198M262 16H286V212H262" stroke="#B59AFB" stroke-width="3"/>
    <path d="M208 113L224 129L252 97" stroke="#B59AFB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="389" cy="114" r="30" fill="#F3F1ED"/>
    <text x="389" y="126" fill="#151518" text-anchor="middle" font-size="44" style="font-family: Georgia, 'Times New Roman', serif">σ</text>
  </g><text x="56" y="440" class="muted" font-size="23" font-weight="400" >Payment controls, enforced at the signer.</text><text x="753" y="440" class="muted" font-size="17" font-weight="400" letter-spacing="1.1">CHECK   /   RELEASE   /   SIGN</text>
</svg>
