[package]
name = "oic-service-chain-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real-node chain clients: JSON-RPC implementations of the broadcaster's ChainClient and the reconciler's BlockSource for live EVM and Solana development networks (RFC 0002 Gate B)"

[dependencies]
oic-domain-types = { workspace = true }
oic-canonical-encoding = { workspace = true }
oic-adapter-api = { workspace = true }
oic-adapter-evm = { workspace = true }
oic-adapter-solana = { workspace = true }
oic-chain-simulator = { workspace = true }
oic-service-broadcaster = { workspace = true }
oic-service-reconciler = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
bs58 = { workspace = true }
base64 = "=0.22.1"

[dev-dependencies]
k256 = { workspace = true }
ed25519-dalek = { workspace = true }
tempfile = { workspace = true }
oic-crypto-provider = { workspace = true }
oic-crypto-provider-frost-ed25519 = { workspace = true }
oic-one-time-state-ledger = { workspace = true }
rand = { workspace = true }
