[workspace]
resolver = "2"
members = [
    "crates/domain-types",
    "crates/canonical-encoding",
    "crates/crypto-provider",
    "crates/adapter-api",
    "crates/adapter-evm",
    "crates/adapter-solana",
    "crates/policy-kernel",
    "crates/authorization-state",
    "crates/approval-verifier",
    "crates/webauthn",
    "crates/audit",
    "crates/one-time-state-ledger",
    "crates/chain-simulator",
    "crates/crypto-provider-dev",
    "crates/crypto-provider-frost-ed25519",
    "crates/signer",
    "crates/membership",
    "crates/peer-wire",
    "crates/node",
    "models/authorization-state-machine",
    "services/broadcaster",
    "services/reconciler",
    "services/api",
    "tests/golden-vectors",
    "services/builder",
    "services/coordinator",
    "services/signer-core",
    "services/authority-rpc",
    "services/signer-net",
    "services/witness",
    "apps/independent-approval-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/etofdn/oss-wallet-insitutional"

[workspace.dependencies]
# internal
oic-domain-types = { path = "crates/domain-types" }
oic-canonical-encoding = { path = "crates/canonical-encoding" }
oic-policy-kernel = { path = "crates/policy-kernel" }
oic-authorization-state = { path = "crates/authorization-state" }
oic-approval-verifier = { path = "crates/approval-verifier" }
oic-webauthn = { path = "crates/webauthn" }
oic-signer = { path = "crates/signer" }
oic-crypto-provider = { path = "crates/crypto-provider" }
oic-crypto-provider-dev = { path = "crates/crypto-provider-dev" }
oic-crypto-provider-frost-ed25519 = { path = "crates/crypto-provider-frost-ed25519" }
oic-adapter-api = { path = "crates/adapter-api" }
oic-adapter-evm = { path = "crates/adapter-evm" }
oic-adapter-solana = { path = "crates/adapter-solana" }
oic-adapter-bitcoin = { path = "crates/adapter-bitcoin" }
oic-adapter-cosmos = { path = "crates/adapter-cosmos" }
oic-adapter-sui = { path = "crates/adapter-sui" }
oic-adapter-aptos = { path = "crates/adapter-aptos" }
oic-adapter-xrpl = { path = "crates/adapter-xrpl" }
oic-audit = { path = "crates/audit" }
oic-chain-simulator = { path = "crates/chain-simulator" }
oic-one-time-state-ledger = { path = "crates/one-time-state-ledger" }
oic-service-builder = { path = "services/builder" }
oic-service-coordinator = { path = "services/coordinator" }
oic-service-broadcaster = { path = "services/broadcaster" }
oic-service-reconciler = { path = "services/reconciler" }
oic-service-api = { path = "services/api" }
oic-membership = { path = "crates/membership" }
oic-peer-wire = { path = "crates/peer-wire" }
oic-node = { path = "crates/node" }
oic-service-signer-core = { path = "services/signer-core" }
oic-service-authority-rpc = { path = "services/authority-rpc" }
oic-service-signer-net = { path = "services/signer-net" }
oic-service-witness = { path = "services/witness" }

# external, pinned
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
thiserror = "2.0"
hex = "0.4"
bs58 = "0.5"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
curve25519-dalek = { version = "4.1" }
k256 = { version = "0.13", features = ["ecdsa", "serde"] }
frost-ed25519 = { version = "2.1" }
frost-core = { version = "2.1" }
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
proptest = "1.5"
stateright = "0.30"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
chacha20poly1305 = { version = "=0.10.1" }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
tempfile = "3"

# dev/test-only differential verifiers (never production dependencies)
alloy-consensus = { version = "=2.5.0", features = ["k256"] }
alloy-eips = { version = "=2.5.0", features = ["k256"] }
alloy-primitives = { version = "=1.7.3", features = ["k256"] }
solana-message = { version = "=6.0.0", features = ["serde", "wincode"] }
solana-transaction = { version = "=6.0.0", features = ["serde", "wincode", "verify"] }
solana-keypair = { version = "=4.0.0" }
solana-signer = { version = "=4.0.0" }
solana-pubkey = { version = "=4.4.0", features = ["curve25519"] }
solana-hash = { version = "=4.7.0" }
solana-instruction = { version = "=4.0.0" }
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
bincode = { version = "=1.3.3" }
solana-compute-budget-interface = { version = "=3.1.0" }
spl-token-interface = { version = "=3.0.0" }
spl-associated-token-account-interface = { version = "=2.0.0" }
# JSON Schema validation of golden-vector inputs (tests/golden-vectors only)
jsonschema = { version = "=0.58.6", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
